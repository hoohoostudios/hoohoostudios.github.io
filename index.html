<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoo&nbsp;Hoo Studios</title>
    <!-- Main stylesheet (Silkscreen is self-hosted in fonts/) -->
    <link rel="stylesheet" href="style.css">
    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <!-- Meta: Social / SEO -->
    <meta name="description" content="Hoo Hoo Studios is an independent app studio, makers of Smooj and Grid Nite.">
    <meta property="og:title" content="Hoo Hoo Studios">
    <meta property="og:description" content="An independent app studio, makers of Smooj and Grid Nite.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Hoo Hoo Studios">
    <meta property="og:url" content="https://hoohoo.studio/">
    <meta property="og:image" content="https://hoohoo.studio/img/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The Hoo Hoo Studios pixel owl above the stacked wordmark, printed in black ink on paper.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#F2EEE3">
    <link rel="canonical" href="https://hoohoo.studio/">
</head>
<body class="landing-page">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7" result="grain"/><feDisplacementMap in="SourceGraphic" in2="grain" scale="1.6" xChannelSelector="R" yChannelSelector="G"/></filter>
    </svg>
    <main>
        <h1 class="title ink"><img class="logo" id="owl" src="img/pixel/owl.svg" alt="" width="128" height="128"><span class="wordmark"><span class="name">Hoo&nbsp;Hoo</span> <span class="descriptor">Studios</span></span></h1>
        <ul class="apps ink">
            <li><a class="app" href="https://apps.apple.com/app/id6758178218" target="_blank" rel="noopener" data-caption="Send love through iMessage"><img src="img/pixel/smooj.svg" alt=""><span>Smooj</span></a></li>
            <li><a class="app" href="https://apps.apple.com/us/app/grid-nite-lights-out-puzzle/id6749193485" target="_blank" rel="noopener" data-caption="A calm lights-out puzzle"><img src="img/pixel/gridnite.svg" alt=""><span>Grid Nite</span></a></li>
        </ul>
        <p class="caption" aria-hidden="true"><span id="caption"></span><span class="caret"></span></p>
    </main>

    <footer>
        <div class="container utility">
            <a href="support.html" target="_blank" rel="noopener">Support</a>
            <a href="privacy.html" target="_blank" rel="noopener">Privacy</a>
            <a href="terms.html" target="_blank" rel="noopener">Terms</a>
            <a href="mailto:support@hoohoo.studio">Contact</a>
            <span class="copyright">&copy; <span id="copyright-year">2026</span></span>
        </div>
    </footer>

    <script>
        // Structured Data - Organization + WebSite + SoftwareApplication
        try {
            const ld = {
              '@context': 'https://schema.org',
              '@graph': [
                {
                  '@type': 'Organization',
                  'name': 'Hoo Hoo Studios',
                  'url': 'https://hoohoo.studio/',
                  'logo': 'https://hoohoo.studio/img/apple-touch-icon-512.png',
                  'email': 'mailto:support@hoohoo.studio'
                },
                {
                  '@type': 'WebSite',
                  'name': 'Hoo Hoo Studios',
                  'url': 'https://hoohoo.studio/'
                },
                {
                  '@type': 'SoftwareApplication',
                  'name': 'Grid Nite',
                  'operatingSystem': 'iOS',
                  'applicationCategory': 'Game',
                  'offers': { '@type': 'Offer', 'price': '0', 'priceCurrency': 'USD' },
                  'url': 'https://apps.apple.com/us/app/grid-nite-lights-out-puzzle/id6749193485'
                },
                {
                  '@type': 'SoftwareApplication',
                  'name': 'Smooj',
                  'operatingSystem': 'iOS',
                  'applicationCategory': 'LifestyleApplication',
                  'offers': { '@type': 'Offer', 'price': '0', 'priceCurrency': 'USD' },
                  'description': 'Send love through iMessage. Track and celebrate the little moments of appreciation in your relationship.',
                  'url': 'https://apps.apple.com/app/id6758178218'
                }
              ]
            };
            const s = document.createElement('script');
            s.type = 'application/ld+json';
            s.textContent = JSON.stringify(ld);
            document.currentScript.parentNode.insertBefore(s, document.currentScript);
        } catch (e) { /* noop */ }

        // Auto-update copyright year
        const yearEl = document.getElementById('copyright-year');
        if (yearEl) yearEl.textContent = new Date().getFullYear();

        // The owl watches the cursor: its pupils shift a pixel toward the
        // pointer in any of eight directions, and every so often it blinks.
        // Pre-drawn frames, swapped whole, so it moves like a sprite.
        (function () {
            const owl = document.getElementById('owl');
            if (!owl || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const src = name => `img/pixel/${name}.svg`;
            // Clockwise from east, one per 45 degrees (screen y points down).
            const DIRS = ['e', 'se', 's', 'sw', 'w', 'nw', 'n', 'ne'];
            DIRS.concat('blink').forEach(d => { new Image().src = src(`owl-${d}`); });
            let look = 'owl', blinking = false;
            const draw = () => { owl.src = src(blinking ? 'owl-blink' : look); };
            addEventListener('pointermove', e => {
                const r = owl.getBoundingClientRect();
                const dx = e.clientX - (r.left + r.width / 2);
                const dy = e.clientY - (r.top + r.height / 2);
                // Over the owl itself it looks straight ahead.
                const next = Math.hypot(dx, dy) < r.width * 0.6 ? 'owl'
                    : `owl-${DIRS[(Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 8) % 8]}`;
                if (next !== look) { look = next; draw(); }
            }, { passive: true });
            const blink = () => {
                blinking = true; draw();
                setTimeout(() => { blinking = false; draw(); }, 140);
                setTimeout(blink, 2500 + Math.random() * 4000);
            };
            setTimeout(blink, 2000);
        })();

        // Hovering an app types its one-liner under the row, then rests at
        // the caret. The names are always visible; this is only the detail.
        (function () {
            const caption = document.getElementById('caption');
            if (!caption) return;
            let typing, current = '';
            const type = text => {
                if (text === current) return;
                current = text;
                clearInterval(typing);
                let shown = caption.textContent;
                typing = setInterval(() => {
                    if (!text.startsWith(shown)) shown = shown.slice(0, -1);
                    else if (shown.length < text.length) shown = text.slice(0, shown.length + 1);
                    else return clearInterval(typing);
                    caption.textContent = shown;
                }, 22);
            };
            document.querySelectorAll('[data-caption]').forEach(el => {
                el.addEventListener('pointerenter', () => type(el.dataset.caption));
                el.addEventListener('focus', () => type(el.dataset.caption));
                el.addEventListener('pointerleave', () => type(''));
                el.addEventListener('blur', () => type(''));
            });
        })();
    </script>
</body>
</html>
