<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Support — Hoo Hoo Studio</title>
  <meta name="description" content="Get support for Hoo Hoo Studio apps." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/owl.svg">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
  <!-- Navigation -->
  <header id="header">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <img src="img/owl.svg" alt="Hoo Hoo Studio logo" class="logo">
        <span>Hoo&nbsp;Hoo&nbsp;Studio</span>
      </a>
      <nav class="nav-links">
        <a href="#support">Support</a>
      </nav>
    </div>
  </header>

  <section id="support" class="section support-page">
    <div class="container content">
      <h2>Support</h2>
      <p>Fill in all required fields and complete the CAPTCHA before sending your request.</p>
      <div class="support-card">
        <form id="supportForm" class="support" novalidate>
          <div class="full">
            <label for="respEmail" class="req">Response Email</label>
            <input id="respEmail" type="email" required>
            <div id="errEmail" class="form-error">Enter a valid email address.</div>
          </div>
          <div>
            <label for="app" class="req">App</label>
            <select id="app" required>
              <option value="">Select an app...</option>
              <option value="Grid Nite">Grid Nite</option>
              <option value="Smooj">Smooj</option>
            </select>
          </div>
          <div>
            <label for="device" class="req">Device Model</label>
            <input id="device" type="text" required>
          </div>
          <div>
            <label for="ios" class="req">iOS Version</label>
            <input id="ios" type="text" required>
          </div>
          <div>
            <label for="appv" class="req">App Version</label>
            <input id="appv" type="text" required>
          </div>
          <div class="full">
            <label for="desc" class="req">Description of Issue</label>
            <textarea id="desc" required></textarea>
          </div>
          <div class="full">
            <div class="g-recaptcha" data-sitekey="6LeUiaMrAAAAAJ9rftmTzJhTWoMcjsKQ4UfkH13g"></div>
            <div id="errCaptcha" class="form-error">Please complete the CAPTCHA.</div>
          </div>
          <div class="full">
            <button id="sendBtn" type="submit" class="btn">Send Support Email</button>
            <div id="formOk" class="form-success">Opening your email client…</div>
          </div>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container footer-content">
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Use</a>
        <a href="#support">Support</a>
      </div>
      <div class="footer-text">
        <p>&copy; <span id="copyright-year"></span> Hoo Hoo Studio. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById('copyright-year').textContent = new Date().getFullYear();

    document.getElementById('supportForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('respEmail').value.trim();
      const app = document.getElementById('app').value.trim();
      const device = document.getElementById('device').value.trim();
      const ios = document.getElementById('ios').value.trim();
      const appv = document.getElementById('appv').value.trim();
      const desc = document.getElementById('desc').value.trim();
      const captchaResponse = (window.grecaptcha && window.grecaptcha.getResponse) ? window.grecaptcha.getResponse() : '';

      if (!email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
        document.getElementById('errEmail').style.display = 'block';
        return;
      } else {
        document.getElementById('errEmail').style.display = 'none';
      }

      if (!app || !device || !ios || !appv || !desc) return;

      if (!captchaResponse) {
        document.getElementById('errCaptcha').style.display = 'block';
        return;
      }
      document.getElementById('errCaptcha').style.display = 'none';

      const subject = `Support Request - ${app}`;
      const body = `Response Email: ${email}\nApp: ${app}\nDevice Model: ${device}\niOS Version: ${ios}\nApp Version: ${appv}\nDescription:\n${desc}`;
      window.location.href = `mailto:support@hoohoo.studio?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      document.getElementById('formOk').style.display = 'block';
    });
  </script>
</body>
</html>
