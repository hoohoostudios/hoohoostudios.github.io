<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Traced from the shipped Grid Nite icon (icon-gridnite.png); shapes fitted to its pixels. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171C22"/>
      <stop offset="1" stop-color="#03070B"/>
    </linearGradient>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.6" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
    <mask id="moon">
      <rect width="96" height="96" fill="#000"/>
      <circle cx="49" cy="47" r="29" fill="#FFF"/>
      <circle cx="60" cy="41" r="22" fill="#000"/>
    </mask>
  </defs>
  <rect width="96" height="96" fill="url(#bg)"/>
  <rect width="96" height="96" fill="url(#dots)"/>
  <rect width="96" height="96" fill="#F2EEED" mask="url(#moon)"/>
  <rect x="52.3" y="32.3" width="17.6" height="17" rx="4" fill="none" stroke="#F2EEED" stroke-width="3.6"/>
</svg>
